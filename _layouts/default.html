<!DOCTYPE html>
<html lang="en">

{%- include head.html -%}

<body>

    <div id="bulkControls" style="display: none;" class="bulk-controls">
    <button id="bulkDelete" class="bulk-delete delete-button">🗑️</button>
    <button id="bulkExport" class="bulk-export export-button">📤</button>
    </div>
    <button id="toggleBulk" class="toggle-bulk pencil-button">✏️</button>
    <button id="burgerButton" class="burger-button">💬</button>
    <aside id="sidebar" class="sidebar">
    <h2>Chats</h2>
    <button id="toggleBulk" class="toggle-bulk bulk-btn">✏️ Select Chats</button>
    <div id="chatList"></div>
    </aside>

<main>
  <h1>📥 Import ChatGPT Conversations</h1>

  <div class="intro-box">
    <p>Upload your exported <code>conversations.json</code> file from ChatGPT.
    <p>Everything is stored in your browser only (via <code>localStorage</code>).</p>
    <p>Source: <a href="https://github.com/syazarilasyraf/log.syazarilasyraf.com" target="_blank" rel="noopener noreferrer">Github</a></p>
  </div>

  <div class="upload-controls">
    <label class="upload-btn">
      📂 Choose Files
      <input type="file" id="fileInput" accept=".json,.md" multiple hidden>
    </label>
    <button onclick="clearAllChats(this)" class="delete-btn">🗑️ Delete All</button>
    <div id="bulkControls" style="display: none;" class="bulk-controls ">
    <button id="bulkDelete" class="bulk-delete delete-btn">🗑️ Delete Selected</button>
    <button id="bulkExport" class="bulk-export export-btn">📤 Export to .Md</button>
    </div>
  </div>

  <section id="chatContainer" class="chat-container"></section>

</main>

  <script src="/assets/js/chat-uploader.js"></script>

</body>
</html>
